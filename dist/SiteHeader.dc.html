<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preload" as="script" href="vendor/react.production.min.js"><link rel="preload" as="script" href="vendor/react-dom.production.min.js">
<script src="./support.js"></script>
<link rel="preload" as="font" type="font/woff2" href="fonts/plus-jakarta-sans-latin-wght-normal.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/instrument-sans-latin-wght-normal.woff2" crossorigin>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="hero-system.css">
</head>
<body>
<x-dc>
<header style="position:sticky;top:0;z-index:60;padding:10px 12px 0;font-family:'Instrument Sans',system-ui,sans-serif">
  <div style="max-width:76rem;margin:0 auto;height:62px;display:flex;align-items:center;gap:8px;padding:0 8px 0 18px;border-radius:18px;background:rgba(246,245,241,.82);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(15,23,20,.08);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 18px 40px -28px rgba(15,23,20,.45)">
    <button onclick="{{ toggleSheet }}" aria-label="Open menu" style="{{ burgerStyle }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0f1714" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <a href="Homepage.dc.html" aria-label="DigitalBurj home" style="display:flex;align-items:center;flex-shrink:0;margin-right:12px"><img src="brand/wordmark-480.webp" alt="DigitalBurj" class="db-header-wordmark"/></a>
    <nav aria-label="Primary" style="{{ navStyle }}">
      <div onmouseenter="{{ openMega }}" onmouseleave="{{ closeMega }}" style="position:relative">
        <button onclick="{{ toggleMega }}" aria-expanded="{{ megaOpen }}" style="height:40px;padding:0 14px;border:none;background:transparent;border-radius:10px;font:500 14px 'Instrument Sans',sans-serif;color:#0f1714;display:flex;align-items:center;gap:6px;cursor:pointer" style-hover="background:rgba(15,23,20,.05)">Ecosystem<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="{{ chevStyle }}"><path d="M6 9l6 6 6-6"/></svg></button>
        <sc-if value="{{ megaOpen }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;top:100%;left:-16px;padding-top:12px;width:min(44rem,92vw)">
            <div style="border-radius:20px;background:#fff;border:1px solid rgba(15,23,20,.08);box-shadow:0 40px 80px -30px rgba(15,23,20,.4);padding:8px;display:grid;grid-template-columns:1.35fr 1fr;gap:8px">
              <div style="display:grid;gap:4px">
                <sc-for list="{{ divisions }}" as="d" hint-placeholder-count="5">
                  <a href="{{ d.href }}" style="display:flex;gap:12px;align-items:center;padding:9px 10px;border-radius:12px;transition:background .25s" style-hover="background:#f6f5f1">
                    <img src="{{ d.icon }}" alt="" class="db-nav-brandmark"/>
                    <span><span style="display:block;font-weight:600;font-size:14px;color:#0f1714">{{ d.name }}</span><span style="display:block;font-size:12.5px;line-height:1.4;color:#5d6560;margin-top:1px">{{ d.line }}</span></span>
                  </a>
                </sc-for>
              </div>
              <a href="GetStarted.dc.html" style="position:relative;overflow:hidden;border-radius:14px;background:#0f1714;color:#f6f5f1;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;min-height:15rem;isolation:isolate">
                <img src="media/01-m.webp" alt="" loading="lazy" decoding="async" style="position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:center 30%"/>
                <span aria-hidden="true" style="position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(11,16,14,.96) 0%,rgba(11,16,14,.78) 42%,rgba(11,16,14,.12) 100%)"></span>
                <span style="position:relative;font:600 11px 'Instrument Sans';letter-spacing:.16em;text-transform:uppercase;color:#ff9a75">Not sure where to start?</span>
                <span style="position:relative;margin-top:6px;font:700 18px/1.25 'Plus Jakarta Sans',sans-serif">Tell us the problem. We'll route it.</span>
                <span style="position:relative;margin-top:12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px">Get started →</span>
              </a>
            </div>
          </div>
        </sc-if>
      </div>
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
        <a href="{{ l.href }}" style="{{ l.style }}" style-hover="background:rgba(15,23,20,.05)">{{ l.label }}</a>
      </sc-for>
    </nav>
    <button onclick="{{ openSearch }}" aria-label="Search (Ctrl K)" style="margin-left:auto;height:40px;padding:0 12px;border-radius:12px;border:1px solid rgba(15,23,20,.1);background:#fff;display:flex;align-items:center;gap:10px;color:#5d6560;font:500 13px 'Instrument Sans';cursor:pointer;transition:border-color .2s" style-hover="border-color:rgba(15,23,20,.3)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span style="{{ kbdStyle }}">Search</span>
      <kbd style="{{ kbdStyle2 }}">⌘K</kbd>
    </button>
    <a href="GetStarted.dc.html" style="height:42px;padding:0 18px;border-radius:12px;background:linear-gradient(110deg,#f23a1d 0%,#f23a1d 40%,#ff7a45 50%,#f23a1d 60%,#f23a1d 100%);background-size:250% 100%;background-position:100% 0;color:#fff;font:600 14px 'Instrument Sans';display:inline-flex;align-items:center;gap:8px;box-shadow:0 10px 24px -10px rgba(242,58,29,.8);transition:background-position .8s cubic-bezier(.22,.8,.24,1),transform .25s;flex-shrink:0" style-hover="background-position:0 0;transform:translateY(-1px)">Get Started<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </div>
</header>

<sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ false }}">
  <div onclick="{{ toggleSheet }}" style="position:fixed;inset:0;z-index:90;background:rgba(15,23,20,.55);backdrop-filter:blur(4px);font-family:'Instrument Sans',sans-serif">
    <div onclick="{{ stop }}" style="position:absolute;top:10px;left:10px;bottom:10px;width:min(22rem,calc(100% - 20px));border-radius:16px;background:#f6f5f1;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 18px 10px"><img src="brand/wordmark-480.webp" alt="DigitalBurj" class="db-header-wordmark"/><button onclick="{{ toggleSheet }}" aria-label="Close menu" style="width:36px;height:36px;border-radius:10px;border:1px solid rgba(15,23,20,.1);background:#fff;cursor:pointer">✕</button></div>
      <div style="flex:1;overflow:auto;padding:8px 12px">
        <p style="margin:10px 6px 8px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8a918c">Ecosystem</p>
        <sc-for list="{{ divisions }}" as="d" hint-placeholder-count="5">
          <a href="{{ d.href }}" style="display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:12px" style-hover="background:#fff"><img src="{{ d.icon }}" alt="" style="width:30px;height:30px;object-fit:contain"/><span style="font-weight:600;color:#0f1714">{{ d.name }}</span></a>
        </sc-for>
        <p style="margin:18px 6px 8px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8a918c">Explore</p>
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
          <a href="{{ l.href }}" style="display:block;padding:12px 8px;border-radius:12px;font-weight:600;color:#0f1714" style-hover="background:#fff">{{ l.label }}</a>
        </sc-for>
      </div>
      <div style="padding:14px"><a href="GetStarted.dc.html" style="height:48px;border-radius:14px;background:#f23a1d;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center">Get Started</a></div>
    </div>
  </div>
</sc-if>

<sc-if value="{{ searchOpen }}" hint-placeholder-val="{{ false }}">
  <div onclick="{{ closeSearch }}" style="position:fixed;inset:0;z-index:95;background:rgba(15,23,20,.5);backdrop-filter:blur(6px);display:flex;justify-content:center;padding:12vh 16px 0;font-family:'Instrument Sans',sans-serif">
    <div onclick="{{ stop }}" role="dialog" aria-label="Search" style="width:min(38rem,100%);height:fit-content;border-radius:20px;background:#fff;box-shadow:0 40px 90px -30px rgba(0,0,0,.6);overflow:hidden">
      <div style="display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid rgba(15,23,20,.08)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5d6560" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input ref="{{ searchRef }}" value="{{ query }}" oninput="{{ setQuery }}" placeholder="Search pages and articles…" style="flex:1;border:none;outline:none;font:500 16px 'Instrument Sans';color:#0f1714;background:transparent"/>
        <kbd style="font:600 11px 'Instrument Sans';color:#8a918c;border:1px solid rgba(15,23,20,.12);border-radius:6px;padding:2px 6px">ESC</kbd>
      </div>
      <div style="max-height:22rem;overflow:auto;padding:8px">
        <sc-for list="{{ results }}" as="r" hint-placeholder-count="6">
          <a href="{{ r.href }}" style="display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px;border-radius:12px" style-hover="background:#f6f5f1">
            <span style="font-weight:600;font-size:14px;color:#0f1714">{{ r.label }}</span>
            <span style="font-size:12px;color:#8a918c">{{ r.kind }}</span>
          </a>
        </sc-for>
        <sc-if value="{{ noResults }}"><p style="padding:16px;margin:0;color:#5d6560;font-size:14px">No matches. Try "automation" or "MVP".</p></sc-if>
      </div>
    </div>
  </div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:520},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { megaOpen: false, sheetOpen: false, searchOpen: false, query: "", narrow: false };
  searchRef = React.createRef();
  divisions = [
    { name: "Business OS", line: "CRM, finance, HR, payroll and operations in one core.", href: "BusinessOS.dc.html", icon: "brand/mark-business-os.webp" },
    { name: "DigitalBurj AI", line: "AI employees that act through controlled tools.", href: "BusinessAI.dc.html", icon: "brand/mark-business-ai.webp" },
    { name: "Growth", line: "Websites, SEO, AEO, AI search, social and ads.", href: "Growth.dc.html", icon: "brand/mark-growth.webp" },
    { name: "Studio", line: "Web apps, mobile apps, custom ERP and integrations.", href: "Studio.dc.html", icon: "brand/mark-studio.webp" },
    { name: "Industry Solutions", line: "Vertical modules for 13 sectors on one core.", href: "Industries.dc.html", icon: "brand/mark-industries.webp" },
    { name: "Academy", line: "Onboarding, certification and digital skills.", href: "Academy.dc.html", icon: "brand/mark-academy.webp" },
    { name: "Verified Talent", line: "Specialists with the evidence attached.", href: "Talent.dc.html", icon: "brand/mark-talent.webp" },
  ];
  linkData = [
    { label: "Pricing", href: "Pricing.dc.html", key: "pricing" },
    { label: "Industries", href: "Industries.dc.html", key: "industries" },
    { label: "Insights", href: "Insights.dc.html", key: "insights" },
    { label: "Company", href: "Company.dc.html", key: "company" },
    { label: "Contact", href: "Contact.dc.html", key: "contact" },
  ];
  index = [
    ...this.divisions.map((d) => ({ label: d.name, href: d.href, kind: "Ecosystem" })),
    ...this.linkData.map((l) => ({ label: l.label, href: l.href, kind: "Page" })),
    { label: "Portfolio", href: "Portfolio.dc.html", kind: "Page" },
    { label: "Jobs", href: "Jobs.dc.html", kind: "Page" },
    { label: "Solutions", href: "Solutions.dc.html", kind: "Page" },
    { label: "Get Started", href: "GetStarted.dc.html", kind: "Page" },
  ];
  componentDidMount() {
    this.onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); this.openSearch(); }
      if (e.key === "Escape") this.setState({ searchOpen: false, sheetOpen: false, megaOpen: false });
    };
    this.onResize = () => this.setState({ narrow: window.innerWidth < 980 });
    window.addEventListener("keydown", this.onKey);
    window.addEventListener("resize", this.onResize);
    this.onResize();
    import("./articles.js").then((m) => { this.articles = m.ARTICLES; this.forceUpdate(); }).catch(() => {});
  }
  componentWillUnmount() { window.removeEventListener("keydown", this.onKey); window.removeEventListener("resize", this.onResize); }
  openSearch = () => { this.setState({ searchOpen: true }, () => setTimeout(() => this.searchRef.current && this.searchRef.current.focus(), 30)); };
  renderVals() {
    const { megaOpen, sheetOpen, searchOpen, query, narrow } = this.state;
    const active = this.props.active;
    const all = [...this.index, ...((this.articles || []).map((a) => ({ label: a.title, href: `Article.dc.html?a=${a.slug}`, kind: "Article" })))];
    const q = query.trim().toLowerCase();
    const results = (q ? all.filter((r) => r.label.toLowerCase().includes(q)) : all).slice(0, 10);
    return {
      megaOpen, sheetOpen, searchOpen, query, results, noResults: results.length === 0,
      divisions: this.divisions,
      links: this.linkData.map((l) => ({ ...l, style: `height:40px;padding:0 14px;border-radius:10px;display:flex;align-items:center;font-size:14px;font-weight:500;color:${l.key === active ? "#f23a1d" : "#0f1714"};transition:background .2s` })),
      navStyle: narrow ? "display:none" : "display:flex;align-items:center;gap:2px",
      burgerStyle: narrow ? "display:grid;place-items:center;width:40px;height:40px;border:none;background:transparent;cursor:pointer;margin-left:-8px" : "display:none",
      kbdStyle: narrow ? "display:none" : "",
      kbdStyle2: narrow ? "display:none" : "font:600 11px 'Instrument Sans';color:#8a918c;border:1px solid rgba(15,23,20,.12);border-radius:6px;padding:1px 5px",
      chevStyle: `transition:transform .3s;transform:rotate(${megaOpen ? 180 : 0}deg)`,
      searchRef: this.searchRef,
      openMega: () => !narrow && this.setState({ megaOpen: true }),
      closeMega: () => this.setState({ megaOpen: false }),
      toggleMega: () => this.setState((s) => ({ megaOpen: !s.megaOpen })),
      toggleSheet: () => this.setState((s) => ({ sheetOpen: !s.sheetOpen })),
      openSearch: this.openSearch,
      closeSearch: () => this.setState({ searchOpen: false }),
      setQuery: (e) => this.setState({ query: e.target.value }),
      stop: (e) => e.stopPropagation(),
    };
  }
}

</script>
</body>
</html>
